<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมดาวน์โหลดวิดีโอ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; margin-top: 8vh; background-color: #f0f2f5; }
        .container { max-width: 480px; margin: auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input[type="text"] { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        select { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; cursor: pointer; box-sizing: border-box; }
        button { width: 90%; padding: 12px 24px; background-color: #e50914; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #b20710; }
        #widgetArea { margin-top: 20px; min-height: 65px; }
        .hint { font-size: 12px; color: #777; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📥 โปรแกรมดาวน์โหลดวิดีโอ</h2>
        <p style="color: #666; font-size: 14px;">รองรับ YouTube, Facebook, TikTok ฯลฯ</p>
        
        <input type="text" id="videoUrl" placeholder="วางลิงก์วิดีโอที่นี่..." required>
        
        <select id="videoQuality">
            <option value="1080">MP4 - ความละเอียด 1080p (Full HD)</option>
            <option value="720" selected>MP4 - ความละเอียด 720p (HD)</option>
            <option value="480">MP4 - ความละเอียด 480p</option>
            <option value="mp3">MP3 - โหลดเฉพาะเสียง</option>
        </select>

        <br>
        <button onclick="generateDownload()">สร้างลิงก์ดาวน์โหลด</button>
        
        <!-- พื้นที่แสดงผลปุ่มโหลด (จะไม่ติดบล็อก CORS) -->
        <div id="widgetArea"></div>

        <p class="hint">💡 เมื่อกดปุ่มแล้ว ระบบจะประมวลผลไฟล์สักครู่ แล้วจะมีปุ่มโหลดสีเขียวปรากฏขึ้นมาครับ</p>
    </div>

    <script>
        function generateDownload() {
            let url = document.getElementById("videoUrl").value.trim();
            const quality = document.getElementById("videoQuality").value;
            const widgetArea = document.getElementById("widgetArea");

            if (!url) {
                alert("กรุณาวางลิงก์ก่อนครับ!");
                return;
            }

            // 1. ระบบตัด tracking code (?si=...) ทิ้ง เพื่อไม่ให้เซิร์ฟเวอร์ Error
            if (url.includes("?si=")) {
                url = url.split("?si=")[0];
            } else if (url.includes("&si=")) {
                url = url.split("&si=")[0];
            }

            widgetArea.innerHTML = "<p style='color: #0051c3; font-weight: bold;'>⏳ กำลังเชื่อมต่อเซิร์ฟเวอร์แปลงไฟล์ โปรดรอสักครู่...</p>";

            // 2. ใช้ระบบ Iframe Button แทน fetch เพื่อไม่ให้เบราว์เซอร์บล็อก CORS
            setTimeout(() => {
                const encodedUrl = encodeURIComponent(url);
                widgetArea.innerHTML = `
                    <iframe 
                        src="https://loader.to/api/button/?url=${encodedUrl}&f=${quality}" 
                        style="width: 100%; height: 65px; border: none; overflow: hidden;" 
                        scrolling="no">
                    </iframe>
                `;
            }, 600);
        }
    </script>
</body>
</html>
